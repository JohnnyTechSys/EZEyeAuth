[project]
name = "ezeyeauth"
version = "2.1.1"
description = "Easy Iris Biometric Authtnication System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "open-iris",
    "opencv-python",
]
keywords = ["iris", "biometrics", "authentication", "eye", "recognition"]
license = "MIT"
authors = [
    {name = "JohnnyTech", email = "johndrostan@outlook.com"},
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/ezeyeauth"]


[dependency-groups]
dev = [
    "twine>=6.2.0",
]

